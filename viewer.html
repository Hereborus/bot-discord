<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>PNGTuber Viewer</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                background: transparent;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #stage {
                width: 100%;
                height: 100%;
                display: flex;
                flex-wrap: wrap;
                align-content: flex-start;
                gap: 8px;
                padding: 8px;
            }

            .avatar {
                position: relative;
                width: var(--avatar-size, 200px);
                height: var(--avatar-size, 200px);
            }
            .avatar img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
                opacity: 0;
                transition: opacity 0.06s;
            }
            .avatar img.vis {
                opacity: 1;
            }

            #err {
                position: fixed;
                top: 8px;
                left: 8px;
                background: rgba(220, 38, 38, 0.85);
                color: #fff;
                font: 11px/1.5 monospace;
                padding: 5px 9px;
                border-radius: 4px;
                display: none;
                max-width: 320px;
            }
            #err.on {
                display: block;
            }
        </style>
    </head>
    <body>
        <div id="stage"></div>
        <div id="err"></div>

        <script>
            // ════════════════════════════════════════════════════════════════
            // PARAMS
            // userId  → n'afficher que cet utilisateur (une source par membre)
            // sourceUrl → URL de l'API /levels du bot
            // poll    → intervalle de polling en ms (défaut 100)
            // size    → taille des avatars CSS (défaut 200px)
            // ════════════════════════════════════════════════════════════════
            const params = new URLSearchParams(location.search);
            const FILTER_UID = params.get("userId") || null;
            const SOURCE_URL =
                params.get("sourceUrl") || `http://${location.host}/levels`;
            const API_BASE = SOURCE_URL.replace("/levels", "");
            const POLL_MS = Math.max(
                50,
                parseInt(params.get("poll") || "100", 10),
            );
            const AVATAR_SIZE = params.get("size") || "200px";

            document.documentElement.style.setProperty(
                "--avatar-size",
                AVATAR_SIZE,
            );

            // ════════════════════════════════════════════════════════════════
            // CONFIG AUDIO — chargée depuis localStorage (même origin que index.html)
            // Mise à jour en temps réel via BroadcastChannel quand on clique
            // "Appliquer" dans index.html
            // ════════════════════════════════════════════════════════════════
            let audioConfig = {
                thresholds: { low: -50, medium: -30, high: -15 },
                emotionHoldMs: 800,
                frameSpeed: 150,
                emotions: [
                    {
                        key: "anger",
                        label: "Anger",
                        minStatus: "medium",
                        dominantBand: "low",
                        sensitivity: 1.2,
                    },
                    {
                        key: "scream",
                        label: "Scream",
                        minStatus: "high",
                        dominantBand: "high",
                        sensitivity: 1.5,
                    },
                ],
            };

            function loadAudioConfig() {
                try {
                    const saved = localStorage.getItem("pngtuber-audioConfig");
                    if (saved) audioConfig = JSON.parse(saved);
                } catch {}
            }

            // Mise à jour live depuis index.html (même origin = même localhost:3000)
            try {
                const bc = new BroadcastChannel("pngtuber-config");
                bc.onmessage = (e) => {
                    if (e.data?.type === "audioConfig") {
                        audioConfig = e.data.data;
                        // Invalider le cache frames pour relire les nouvelles émotions
                        Object.keys(frameCache).forEach(
                            (k) => delete frameCache[k],
                        );
                    }
                };
            } catch {}

            // ════════════════════════════════════════════════════════════════
            // CLASSIFICATION LOCALE
            // ════════════════════════════════════════════════════════════════
            function classifyStatus(db) {
                const t = audioConfig.thresholds;
                if (db >= t.high) return "high";
                if (db >= t.medium) return "medium";
                if (db >= t.low) return "low";
                return "silent";
            }

            function detectEmotion(status, freq) {
                if (!freq || status === "silent") return null;
                const levels = ["silent", "low", "medium", "high"];
                for (const em of audioConfig.emotions) {
                    if (levels.indexOf(status) < levels.indexOf(em.minStatus))
                        continue;
                    const dom = freq[em.dominantBand] ?? 0;
                    const others = Object.entries(freq)
                        .filter(([k]) => k !== em.dominantBand)
                        .map(([, v]) => v);
                    if (others.every((v) => dom > v * em.sensitivity))
                        return em.key;
                }
                return null;
            }

            // ════════════════════════════════════════════════════════════════
            // FRAME CACHE — charge les URLs HTTP depuis le bot
            // ════════════════════════════════════════════════════════════════
            // { `uid__stateKey` → ['http://localhost:3000/images/...', ...] }
            const frameCache = {};

            async function getFrames(uid, stateKey) {
                const k = `${uid}__${stateKey}`;
                if (k in frameCache) return frameCache[k];

                try {
                    const res = await fetch(`${API_BASE}/frames/${uid}`, {
                        cache: "no-store",
                    });
                    if (!res.ok) {
                        frameCache[k] = [];
                        return [];
                    }
                    const data = await res.json();

                    // Mettre en cache tous les états d'un coup
                    for (const [state, frames] of Object.entries(data)) {
                        const ck = `${uid}__${state}`;
                        frameCache[ck] = frames.map(
                            (f) => `${API_BASE}${f.url}`,
                        );
                    }

                    // Si l'état demandé n'était pas dans la réponse
                    if (!(k in frameCache)) frameCache[k] = [];
                } catch {
                    frameCache[k] = [];
                }

                return frameCache[k] || [];
            }

            // Invalider le cache quand index.html uploade / réordonne
            try {
                const bc2 = new BroadcastChannel("pngtuber-frames");
                bc2.onmessage = (e) => {
                    const { uid, stateKey } = e.data || {};
                    if (uid && stateKey)
                        delete frameCache[`${uid}__${stateKey}`];
                    else
                        Object.keys(frameCache).forEach(
                            (k) => delete frameCache[k],
                        );
                };
            } catch {}

            // ════════════════════════════════════════════════════════════════
            // FLIPBOOK ENGINE
            // ════════════════════════════════════════════════════════════════
            const flipbooks = {};

            function startFlipbook(uid, urls) {
                const speed = audioConfig.frameSpeed || 150;
                const key = urls.join("|");
                const fb = flipbooks[uid];
                if (!fb) return;
                if (fb.activeKey === key && fb.intervalId) return;

                stopFlipbook(uid);
                fb.urls = urls;
                fb.activeKey = key;
                fb.idx = 0;

                if (urls.length === 0) {
                    setAvatarFrame(uid, null);
                    return;
                }
                setAvatarFrame(uid, urls[0]);
                if (urls.length === 1) return;

                fb.intervalId = setInterval(() => {
                    fb.idx = (fb.idx + 1) % fb.urls.length;
                    setAvatarFrame(uid, fb.urls[fb.idx]);
                }, speed);
            }

            function stopFlipbook(uid) {
                const fb = flipbooks[uid];
                if (!fb) return;
                if (fb.intervalId) {
                    clearInterval(fb.intervalId);
                    fb.intervalId = null;
                }
                fb.activeKey = null;
            }

            // ════════════════════════════════════════════════════════════════
            // DOM AVATARS
            // ════════════════════════════════════════════════════════════════
            const stage = document.getElementById("stage");
            const avatars = {};

            function ensureAvatar(uid) {
                if (avatars[uid]) return;
                const el = document.createElement("div");
                el.className = "avatar";
                el.id = `av-${uid}`;
                const img = document.createElement("img");
                el.appendChild(img);
                stage.appendChild(el);
                avatars[uid] = { el, img };
                flipbooks[uid] = {
                    intervalId: null,
                    urls: [],
                    idx: 0,
                    activeKey: null,
                };
            }

            function removeAvatar(uid) {
                stopFlipbook(uid);
                avatars[uid]?.el.remove();
                delete avatars[uid];
                delete flipbooks[uid];
                delete userStates[uid];
            }

            function setAvatarFrame(uid, url) {
                const av = avatars[uid];
                if (!av) return;
                if (url) {
                    av.img.src = url;
                    av.img.classList.add("vis");
                } else {
                    av.img.src = "";
                    av.img.classList.remove("vis");
                }
            }

            // ════════════════════════════════════════════════════════════════
            // HOLD ÉMOTION
            // ════════════════════════════════════════════════════════════════
            const userStates = {};

            function resolveDisplayKey(uid, status, emotion) {
                const s = userStates[uid];
                const now = Date.now();

                if (s.holdUntil && now < s.holdUntil && s.lastEmotion)
                    return s.lastEmotion;

                if (s.holdUntil && now >= s.holdUntil) {
                    s.holdUntil = null;
                    s.lastEmotion = null;
                }

                if (emotion) {
                    s.lastEmotion = emotion;
                    s.holdUntil = now + audioConfig.emotionHoldMs;
                    return emotion;
                }

                return status;
            }

            // ════════════════════════════════════════════════════════════════
            // UPDATE PAR USER
            // ════════════════════════════════════════════════════════════════
            async function applyUser(uid, info) {
                ensureAvatar(uid);
                if (!userStates[uid])
                    userStates[uid] = {
                        displayKey: null,
                        holdUntil: null,
                        lastEmotion: null,
                    };

                const status = classifyStatus(info.db ?? -100);
                const emotion = info.speaking
                    ? detectEmotion(status, info.freq)
                    : null;
                const displayKey = resolveDisplayKey(uid, status, emotion);

                if (displayKey !== userStates[uid].displayKey) {
                    userStates[uid].displayKey = displayKey;
                    // Invalider le cache pour relire depuis le serveur à chaque changement d'état
                    delete frameCache[`${uid}__${displayKey}`];
                    const urls = await getFrames(uid, displayKey);
                    startFlipbook(uid, urls);
                }
            }

            // ════════════════════════════════════════════════════════════════
            // POLL
            // ════════════════════════════════════════════════════════════════
            async function poll() {
                try {
                    const res = await fetch(SOURCE_URL, { cache: "no-store" });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    hideErr();

                    // Si userId filtré → n'afficher que cet utilisateur
                    let ids = Object.keys(data).filter((k) => k !== "_bot");
                    if (FILTER_UID) ids = ids.filter((id) => id === FILTER_UID);

                    for (const uid of ids) await applyUser(uid, data[uid]);

                    // Retirer les avatars absents
                    for (const uid of Object.keys(avatars)) {
                        if (!ids.includes(uid)) removeAvatar(uid);
                    }
                } catch (err) {
                    showErr(`${err.message} — ${SOURCE_URL}`);
                }
            }

            // ════════════════════════════════════════════════════════════════
            // UTILS
            // ════════════════════════════════════════════════════════════════
            const errEl = document.getElementById("err");
            function showErr(msg) {
                errEl.textContent = msg;
                errEl.classList.add("on");
            }
            function hideErr() {
                errEl.classList.remove("on");
            }

            // ════════════════════════════════════════════════════════════════
            // INIT
            // ════════════════════════════════════════════════════════════════
            loadAudioConfig();
            setInterval(poll, POLL_MS);
            poll();
        </script>
    </body>
</html>
