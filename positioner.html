<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Position Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap');

:root {
  --bg:     #0c0c10;
  --bg2:    #13131a;
  --bg3:    #1a1a24;
  --border: #252535;
  --accent: #5b4ff5;
  --accent2:#00d9b8;
  --text:   #dde1f0;
  --muted:  #5a5a7a;
  --r:      8px;
  --font:   'Outfit', sans-serif;
  --mono:   'Fira Code', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

body { display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
  background: var(--bg2); flex-shrink: 0; flex-wrap: wrap;
}
.logo { font-family: var(--mono); font-size: 0.85rem; color: var(--accent2); white-space: nowrap; }
.logo em { color: var(--accent); font-style: normal; }
.badge {
  padding: 0.2rem 0.6rem; border-radius: 20px;
  background: rgba(91,79,245,0.2); border: 1px solid rgba(91,79,245,0.3);
  font-size: 0.7rem; font-family: var(--mono); color: var(--accent);
}
.hbtn {
  padding: 0.3rem 0.8rem; border-radius: 6px; border: none;
  font-family: var(--font); font-size: 0.75rem; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s;
}
.hbtn:hover { opacity: 0.8; }
.hbtn.primary { background: var(--accent2); color: #000; }
.hbtn.ghost   { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
.ml { margin-left: auto; }
.saved-toast {
  font-size: 0.72rem; color: var(--accent2); opacity: 0;
  transition: opacity 0.3s; white-space: nowrap;
}
.saved-toast.show { opacity: 1; }

/* LAYOUT */
.workspace {
  display: flex; flex: 1; overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 1rem; }

.sec { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.4rem; }

/* Canvas size controls */
.canvas-size-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; }
.canvas-size-row input[type=number] {
  width: 60px; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 0.75rem;
  padding: 0.25rem 0.4rem; border-radius: 4px; outline: none;
  text-align: center;
}
.canvas-size-row span { color: var(--muted); }

/* Frame list */
.frame-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.5rem; cursor: pointer;
  transition: border-color 0.15s; display: flex; flex-direction: column; gap: 0.4rem;
}
.frame-card:hover { border-color: var(--accent); }
.frame-card.active { border-color: var(--accent2); }
.frame-card-head { display: flex; align-items: center; gap: 0.4rem; }
.frame-thumb { width: 36px; height: 36px; object-fit: contain; border-radius: 3px; background: #fff1; flex-shrink: 0; }
.frame-name { font-size: 0.65rem; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame-active-badge {
  font-size: 0.58rem; padding: 0.1rem 0.35rem; border-radius: 10px;
  background: rgba(0,217,184,0.15); color: var(--accent2); border: 1px solid rgba(0,217,184,0.3);
  display: none;
}
.frame-card.active .frame-active-badge { display: block; }

/* Transform controls */
.transform-group { display: flex; flex-direction: column; gap: 0.5rem; }
.tf-row { display: flex; align-items: center; gap: 0.5rem; }
.tf-label { font-size: 0.68rem; color: var(--muted); width: 14px; font-family: var(--mono); }
.tf-slider { flex: 1; accent-color: var(--accent); }
.tf-val {
  font-family: var(--mono); font-size: 0.68rem; color: var(--accent2);
  width: 44px; text-align: right;
}
.tf-reset {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 0.65rem; padding: 1px 3px; border-radius: 3px;
}
.tf-reset:hover { color: var(--accent2); background: var(--bg2); }

/* Opacity info */
.opacity-info {
  font-size: 0.68rem; color: var(--muted); line-height: 1.6;
  padding: 0.4rem 0.5rem; background: var(--bg); border-radius: 5px; border: 1px solid var(--border);
}

/* CANVAS AREA */
.canvas-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: repeating-conic-gradient(#1a1a24 0% 25%, #13131a 0% 50%) 0 0 / 20px 20px;
  overflow: hidden; position: relative;
}
.canvas-wrap {
  position: relative; overflow: hidden;
  box-shadow: 0 0 0 1px var(--border), 0 8px 32px rgba(0,0,0,0.5);
}
.canvas-wrap .layer {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.canvas-wrap .layer.draggable { pointer-events: auto; cursor: grab; }
.canvas-wrap .layer.draggable:active { cursor: grabbing; }
.canvas-wrap .layer img {
  position: absolute;
  transform-origin: center center;
  max-width: none; max-height: none;
  user-select: none; pointer-events: none;
  width: 100%; height: 100%; object-fit: contain;
}

/* Crosshair */
.crosshair {
  position: absolute; pointer-events: none; opacity: 0.15;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}
.crosshair::before {
  content: ''; position: absolute;
  width: 1px; height: 100vh; background: var(--accent2);
  left: 50%; transform: translateX(-50%);
}
.crosshair::after {
  content: ''; position: absolute;
  height: 1px; width: 100vw; background: var(--accent2);
  top: 50%; transform: translateY(-50%);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">PNG<em>Tuber</em> · <span style="color:var(--muted)">Position Editor</span></div>
  <span class="badge" id="state-badge">—</span>
  <span class="badge" id="user-badge" style="background:rgba(0,217,184,0.1);border-color:rgba(0,217,184,0.3);color:var(--accent2);">—</span>
  <span class="saved-toast" id="saved-toast">✓ Sauvegardé</span>
  <div class="hflex ml" style="display:flex;gap:0.5rem;">
    <button class="hbtn ghost" onclick="resetAll()">↺ Reset tout</button>
    <button class="hbtn primary" onclick="saveAll()">✓ Sauvegarder</button>
  </div>
</header>

<div class="workspace">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-scroll">

      <!-- Canvas size -->
      <div>
        <div class="sec">Taille du canvas</div>
        <div class="canvas-size-row">
          <input type="number" id="cw" value="500" min="100" max="2000" step="10" oninput="resizeCanvas()">
          <span>×</span>
          <input type="number" id="ch" value="500" min="100" max="2000" step="10" oninput="resizeCanvas()">
          <span style="color:var(--muted)">px</span>
        </div>
      </div>

      <!-- Frames de l'état -->
      <div>
        <div class="sec" id="frames-sec">Frames de l'état</div>
        <div id="frame-list" style="display:flex;flex-direction:column;gap:0.4rem;"></div>
      </div>

      <!-- Transform de la frame sélectionnée -->
      <div id="transform-panel" style="display:none;">
        <div class="sec">Position — <span id="selected-frame-name" style="text-transform:none;letter-spacing:0;color:var(--accent2);"></span></div>
        <div class="transform-group">
          <div class="tf-row">
            <span class="tf-label">X</span>
            <input class="tf-slider" type="range" id="sl-x" min="-500" max="500" step="1" value="0" oninput="onSliderChange('x', this.value)">
            <span class="tf-val" id="val-x">0px</span>
            <button class="tf-reset" onclick="resetAxis('x')" title="Reset X">↺</button>
          </div>
          <div class="tf-row">
            <span class="tf-label">Y</span>
            <input class="tf-slider" type="range" id="sl-y" min="-500" max="500" step="1" value="0" oninput="onSliderChange('y', this.value)">
            <span class="tf-val" id="val-y">0px</span>
            <button class="tf-reset" onclick="resetAxis('y')" title="Reset Y">↺</button>
          </div>
          <div class="tf-row">
            <span class="tf-label">S</span>
            <input class="tf-slider" type="range" id="sl-s" min="0.1" max="3" step="0.01" value="1" oninput="onSliderChange('s', this.value)">
            <span class="tf-val" id="val-s">1.00×</span>
            <button class="tf-reset" onclick="resetAxis('s')" title="Reset Scale">↺</button>
          </div>
        </div>
      </div>

      <!-- Info opacité -->
      <div class="opacity-info">
        🖼 <strong>Silent</strong> = fond de référence (opaque)<br>
        Frames de l'état = semi-transparentes<br>
        Frame <strong>sélectionnée</strong> = légèrement plus visible
      </div>

    </div>
  </div>

  <!-- CANVAS AREA -->
  <div class="canvas-area" id="canvas-area">
    <div class="canvas-wrap" id="canvas-wrap" style="width:500px;height:500px;">
      <div class="crosshair"></div>
      <!-- Silent layer (fond) -->
      <div class="layer" id="layer-silent">
        <img id="silent-img" src="" alt="" style="display:none;">
      </div>
      <!-- Layers des frames de l'état (générés dynamiquement) -->
      <div id="layers-container"></div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════
// PARAMS
// ════════════════════════════════════════════════════════════════
const params   = new URLSearchParams(location.search);
const USER_ID  = params.get('userId') || '';
const STATE    = params.get('state')  || 'low';
const API_BASE = `http://${location.host}`;

document.getElementById('state-badge').textContent  = STATE;
document.getElementById('user-badge').textContent   = '…';
document.getElementById('frames-sec').textContent   = `Frames — ${STATE}`;

// Canvas size depuis params si fourni
const pw = parseInt(params.get('w') || '500');
const ph = parseInt(params.get('h') || '500');
document.getElementById('cw').value = pw;
document.getElementById('ch').value = ph;

// ════════════════════════════════════════════════════════════════
// ÉTAT
// ════════════════════════════════════════════════════════════════

// positions[file] = { x, y, s }
const positions = {};

// frames de l'état cible
let stateFrames  = [];
// frame silent (première)
let silentFrames = [];

let selectedFile = null;

// ════════════════════════════════════════════════════════════════
// LOCALSTORAGE
// ════════════════════════════════════════════════════════════════
function posKey(file) {
  return `pos__${USER_ID}__${STATE}__${file}`;
}

function loadPositions() {
  for (const f of stateFrames) {
    try {
      const saved = localStorage.getItem(posKey(f.file));
      positions[f.file] = saved ? JSON.parse(saved) : { x:0, y:0, s:1 };
    } catch {
      positions[f.file] = { x:0, y:0, s:1 };
    }
  }
}

function saveAll() {
  for (const [file, pos] of Object.entries(positions)) {
    localStorage.setItem(posKey(file), JSON.stringify(pos));
  }
  // Notifier viewer.html
  try { new BroadcastChannel('pngtuber-positions').postMessage({ userId: USER_ID, state: STATE }); } catch {}
  showToast();
}

function resetAll() {
  for (const f of stateFrames) {
    positions[f.file] = { x:0, y:0, s:1 };
    localStorage.removeItem(posKey(f.file));
  }
  updateAllLayers();
  if (selectedFile) updateSliders(positions[selectedFile]);
  showToast();
}

function showToast() {
  const t = document.getElementById('saved-toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ════════════════════════════════════════════════════════════════
// CHARGEMENT DES FRAMES DEPUIS LE BOT
// ════════════════════════════════════════════════════════════════
async function loadFrames() {
  const res  = await fetch(`${API_BASE}/frames/${USER_ID}`, { cache: 'no-store' });
  const data = await res.json();

  silentFrames = data['silent']    || data['silent_open'] || [];
  stateFrames  = data[STATE]       || [];

  // Afficher le displayName si dispo via /levels
  try {
    const lr = await fetch(`${API_BASE}/levels`, { cache:'no-store' });
    const ld = await lr.json();
    if (ld[USER_ID]?.displayName) {
      document.getElementById('user-badge').textContent = ld[USER_ID].displayName;
    } else {
      document.getElementById('user-badge').textContent = USER_ID.slice(0,8)+'…';
    }
  } catch {
    document.getElementById('user-badge').textContent = USER_ID.slice(0,8)+'…';
  }

  loadPositions();
  renderSilent();
  renderFrameList();
  renderLayers();
  resizeCanvas();

  // Sélectionner la première frame auto
  if (stateFrames.length > 0) selectFrame(stateFrames[0].file);
}

// ════════════════════════════════════════════════════════════════
// SILENT DE FOND
// ════════════════════════════════════════════════════════════════
function renderSilent() {
  const img = document.getElementById('silent-img');
  if (silentFrames.length > 0) {
    img.src   = `${API_BASE}${silentFrames[0].url}`;
    img.style.display = 'block';
    img.style.opacity = '1';
    img.style.transform = 'translate(0px, 0px) scale(1)';
  } else {
    img.style.display = 'none';
  }
}

// ════════════════════════════════════════════════════════════════
// FRAME LIST (sidebar)
// ════════════════════════════════════════════════════════════════
function renderFrameList() {
  const list = document.getElementById('frame-list');
  list.innerHTML = '';

  if (stateFrames.length === 0) {
    list.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);">Aucune frame pour cet état.</div>`;
    return;
  }

  for (const f of stateFrames) {
    const card = document.createElement('div');
    card.className = 'frame-card';
    card.id = `fc-${f.file}`;
    card.innerHTML = `
      <div class="frame-card-head">
        <img class="frame-thumb" src="${API_BASE}${f.url}" alt="">
        <span class="frame-name">${esc(f.file)}</span>
        <span class="frame-active-badge">actif</span>
      </div>
      <div style="font-size:0.62rem;color:var(--muted);font-family:var(--mono);" id="fpos-${f.file}">
        x:0 y:0 s:1.00
      </div>
    `;
    card.addEventListener('click', () => selectFrame(f.file));
    list.appendChild(card);
    updateFrameCardPos(f.file);
  }
}

function updateFrameCardPos(file) {
  const el = document.getElementById(`fpos-${file}`);
  if (!el) return;
  const p = positions[file] || { x:0, y:0, s:1 };
  el.textContent = `x:${Math.round(p.x)} y:${Math.round(p.y)} s:${(+p.s).toFixed(2)}`;
}

// ════════════════════════════════════════════════════════════════
// LAYERS CANVAS
// ════════════════════════════════════════════════════════════════
function renderLayers() {
  const cont = document.getElementById('layers-container');
  cont.innerHTML = '';

  for (const f of stateFrames) {
    const layer = document.createElement('div');
    layer.className = 'layer draggable';
    layer.id        = `layer-${f.file}`;
    layer.style.zIndex = '1';

    const img = document.createElement('img');
    img.src     = `${API_BASE}${f.url}`;
    img.dataset.file = f.file;
    img.style.opacity = '0.35';
    layer.appendChild(img);

    // Drag
    let dragging = false, startX, startY, startPosX, startPosY;
    layer.addEventListener('mousedown', e => {
      selectFrame(f.file);
      dragging  = true;
      startX    = e.clientX;
      startY    = e.clientY;
      startPosX = positions[f.file].x;
      startPosY = positions[f.file].y;
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging || selectedFile !== f.file) return;
      positions[f.file].x = startPosX + (e.clientX - startX);
      positions[f.file].y = startPosY + (e.clientY - startY);
      applyTransform(f.file);
      updateSliders(positions[f.file]);
      updateFrameCardPos(f.file);
    });
    window.addEventListener('mouseup', () => { if (dragging) { dragging = false; saveAll(); } });

    cont.appendChild(layer);
    applyTransform(f.file);
  }
}

function applyTransform(file) {
  const layer = document.getElementById(`layer-${file}`);
  if (!layer) return;
  const p   = positions[file] || { x:0, y:0, s:1 };
  const img = layer.querySelector('img');
  img.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.s})`;
}

function updateAllLayers() {
  for (const f of stateFrames) {
    applyTransform(f.file);
    updateFrameCardPos(f.file);
  }
}

// ════════════════════════════════════════════════════════════════
// SÉLECTION DE FRAME
// ════════════════════════════════════════════════════════════════
function selectFrame(file) {
  selectedFile = file;

  // Sidebar cards
  document.querySelectorAll('.frame-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`fc-${file}`)?.classList.add('active');

  // Opacité layers
  for (const f of stateFrames) {
    const img = document.querySelector(`#layer-${f.file} img`);
    if (!img) continue;
    img.style.opacity  = f.file === file ? '0.65' : '0.35';
  }
  // Z-index
  document.querySelectorAll('#layers-container .layer').forEach(l => l.style.zIndex = '1');
  const activeLayer = document.getElementById(`layer-${file}`);
  if (activeLayer) activeLayer.style.zIndex = '2';

  // Panel transform
  document.getElementById('transform-panel').style.display = 'block';
  document.getElementById('selected-frame-name').textContent = file.length > 28 ? '…'+file.slice(-25) : file;
  updateSliders(positions[file] || { x:0, y:0, s:1 });
}

// ════════════════════════════════════════════════════════════════
// SLIDERS
// ════════════════════════════════════════════════════════════════
function updateSliders(pos) {
  document.getElementById('sl-x').value = pos.x;
  document.getElementById('sl-y').value = pos.y;
  document.getElementById('sl-s').value = pos.s;
  document.getElementById('val-x').textContent = Math.round(pos.x) + 'px';
  document.getElementById('val-y').textContent = Math.round(pos.y) + 'px';
  document.getElementById('val-s').textContent = (+pos.s).toFixed(2) + '×';
}

function onSliderChange(axis, val) {
  if (!selectedFile) return;
  if (!positions[selectedFile]) positions[selectedFile] = { x:0, y:0, s:1 };
  positions[selectedFile][axis] = +val;
  document.getElementById(`val-${axis}`).textContent =
    axis === 's' ? (+val).toFixed(2)+'×' : Math.round(val)+'px';
  applyTransform(selectedFile);
  updateFrameCardPos(selectedFile);
}

function resetAxis(axis) {
  if (!selectedFile) return;
  const def = axis === 's' ? 1 : 0;
  positions[selectedFile][axis] = def;
  document.getElementById(`sl-${axis}`).value = def;
  document.getElementById(`val-${axis}`).textContent =
    axis === 's' ? '1.00×' : '0px';
  applyTransform(selectedFile);
  updateFrameCardPos(selectedFile);
  saveAll();
}

// ════════════════════════════════════════════════════════════════
// CANVAS RESIZE
// ════════════════════════════════════════════════════════════════
function resizeCanvas() {
  const w = parseInt(document.getElementById('cw').value) || 500;
  const h = parseInt(document.getElementById('ch').value) || 500;
  const wrap = document.getElementById('canvas-wrap');
  wrap.style.width  = w + 'px';
  wrap.style.height = h + 'px';
}

// ════════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════════
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
if (!USER_ID) {
  document.getElementById('canvas-area').innerHTML =
    '<div style="color:#e74c6c;font-size:0.9rem;padding:2rem;">❌ userId manquant dans l\'URL</div>';
} else {
  loadFrames().catch(err => {
    document.getElementById('canvas-area').innerHTML =
      `<div style="color:#e74c6c;font-size:0.9rem;padding:2rem;">❌ Erreur: ${err.message}</div>`;
  });
}
</script>
</body>
</html>
